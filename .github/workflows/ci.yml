name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: Install pinned, hashed dependencies
        run: pip install --require-hashes -r api/requirements.txt -r api/requirements-dev.txt # fixed missing api/ for api/requirements-dev.txt
      - name: Lint
        run: ruff check api
      - name: SAST
        run: bandit -r api/ -x api/test_main.py
      - name: SCA
        run: pip-audit
      - name: Tests
        run: pytest api/test_main.py
