name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pinned, hashed dependencies
        run: pip install --require-hashes -r api/requirements.txt -r api/requirements-dev.txt
      - name: Lint
        run: ruff check api
      - name: SAST
        run: bandit -r api/ -x api/test_main.py
      - name: SCA
        run: pip-audit
      - name: Tests
        run: pytest api/test_main.py
